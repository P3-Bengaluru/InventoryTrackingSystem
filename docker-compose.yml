version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: its_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inventory_db}
      POSTGRES_USER: ${DB_USER:-its_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-its_user} -d ${DB_NAME:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: its_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inventory_db}
      DB_USER: ${DB_USER:-its_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-replace_64_char_hex}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace_another_64_char_hex}
      PORT: 3001
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-https://inventory.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-inventory@office.local}
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/server/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: its_client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  nginx:
    image: nginx:alpine
    container_name: its_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - CLIENT_URL=client:80
      - API_URL=api:3001

volumes:
  pg_data:
  uploads:
