version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: its_postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-its_user} -d ${DB_NAME:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: its_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - uploads:/app/server/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: its_client
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ./.env
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_CLIENT_URL: ${VITE_CLIENT_URL}
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: its_nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      CLIENT_URL: ${CLIENT_URL}
      API_URL: ${VITE_API_URL}

volumes:
  pg_data:
  uploads:
